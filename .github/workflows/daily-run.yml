# Save as .github/workflows/daily-run.yml in your repo.
# Wakes the Render service and triggers the master workflow at 08:00 IST (02:30 UTC).
# Repo secrets needed: N8N_BASE_URL (e.g. https://your-service.onrender.com), N8N_RUN_TOKEN
name: daily-po-run
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Wake service (cold start can take ~1 minute)
        run: curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "${{ secrets.N8N_BASE_URL }}/healthz"
      - name: Trigger master workflow
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "${{ secrets.N8N_BASE_URL }}/webhook/run-po-automation" \
            -H "X-Run-Token: ${{ secrets.N8N_RUN_TOKEN }}"
